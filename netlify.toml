[build]
  command = "npm ci && ./node_modules/.bin/tailwindcss -i ./assets/css/input.css -o ./assets/css/tailwind.css --minify"
  publish = "."
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Keep long-term cache for assets…
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# …but override JUST the compiled Tailwind file so style updates take effect.
# (Place AFTER the generic /assets/* rule so it wins.)
[[headers]]
  for = "/assets/css/tailwind.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Removed cdn.tailwindcss.com from script-src since we’re not using the CDN anymore
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com; font-src https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self'; frame-ancestors 'self';"

[[redirects]]
  from = "/contact-success"
  to = "/thanks.html"
  status = 301

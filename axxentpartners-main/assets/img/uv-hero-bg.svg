<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated UV background">
  <defs>
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="wash" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      .grid { stroke: rgba(255,255,255,.07); stroke-width:1 }
      .track{ stroke:#fff; stroke-opacity:.14; stroke-width:5; stroke-linecap:round; fill:none }
      .leg  { stroke: url(#uv); stroke-width:4; stroke-linecap:round; filter:url(#glow); stroke-opacity:.6; fill:none }
      .out  { stroke: url(#uv); stroke-width:4; stroke-linecap:round; filter:url(#glow); stroke-opacity:.68; fill:none }
      .flow { stroke-dasharray:80 220; animation:flow 3s linear infinite }
      .slow { animation-duration:4.2s }
      .core { fill:url(#uv); filter:url(#glow) }
      .burst{ stroke:url(#uv); stroke-width:3; stroke-linecap:round; stroke-opacity:.42; fill:none; filter:url(#glow) }
      @keyframes flow { from { stroke-dashoffset:0 } to { stroke-dashoffset:-320 } }
      @keyframes pulse{ 0%,100%{ r:56; opacity:.65 } 50%{ r:68; opacity:.35 } }
      .pulse { animation:pulse 3.6s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none } }
    </style>
  </defs>

  <!-- wash + grid -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#wash)"/>
  <g class="grid">
    <line x1="120" y1="60"  x2="120" y2="360"/>
    <line x1="360" y1="60"  x2="360" y2="360"/>
    <line x1="600" y1="60"  x2="600" y2="360"/>
    <line x1="840" y1="60"  x2="840" y2="360"/>
    <line x1="1080" y1="60" x2="1080" y2="360"/>
    <line x1="60" y1="120"  x2="1140" y2="120"/>
    <line x1="60" y1="210"  x2="1140" y2="210"/>
    <line x1="60" y1="300"  x2="1140" y2="300"/>
  </g>

  <!-- three legs from left -->
  <path d="M192,120 C320,120 440,150 560,180" class="leg flow slow"/>
  <path d="M192,203 C320,206 440,210 560,210" class="track"/>
  <path d="M192,203 C320,206 440,210 560,210" class="leg flow"/>
  <path d="M192,300 C320,300 440,260 560,240" class="leg flow" style="animation-delay:.2s"/>

  <!-- UV core + subtle burst -->
  <g transform="translate(600,210)">
    <circle r="62" class="core pulse"/>
    <circle r="92" class="burst"/>
  </g>

  <!-- rightward connectors (no dots; good for generic backgrounds) -->
  <path d="M662,188 C760,160 820,160 940,190" class="out flow" style="animation-delay:.15s"/>
  <path d="M662,210 C780,210 900,210 940,210" class="track"/>
  <path d="M662,210 C780,210 900,210 940,210" class="out flow" style="animation-delay:.30s"/>
  <path d="M662,232 C760,260 820,260 940,230" class="out flow" style="animation-delay:.45s"/>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      window.PAGE_META = {
        title: "About – Axxent Partners",
        description: "Turn loyalty from a cost center to a growth engine.",
        image: "/assets/img/og-image.svg",
        version: "8",
      };
    </script>
    <!-- 1) Tiny anti-FOUC base (inline so it applies immediately) -->
    <style>html.tw-wait{visibility:hidden}</style>

    <!-- 2) Tailwind (compiled locally) — render-blocking on purpose to avoid blink -->
    <link id="twcss" rel="stylesheet" href="/assets/css/tailwind.css" />

    <!-- 3) Your custom layers AFTER Tailwind so they can override it -->
    <link rel="stylesheet" href="/assets/css/brand.css" />
    <link rel="stylesheet" href="/assets/css/glow.css" />

    <!-- 4) Fonts/meta helper; defer so scripts don't block paint -->
    <script src="/assets/js/head-meta.js" defer></script>
  </head>
  <body class="bg-[var(--brand-bg)] text-[var(--brand-fg)] antialiased">
    <div id="site-header"></div> <!-- ✅ header injection point -->

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
      <h1 class="text-4xl font-extrabold">Talk to Sales</h1>
      <p class="mt-4 text-white/80">
        Tell us about your program and goals. We'll follow up quickly.
      </p>
      <form
        class="mt-8 max-w-xl space-y-4"
        name="contact"
        method="POST"
        data-netlify="true"
        data-netlify-recaptcha="true"
        netlify-honeypot="bot-field"
        action="/thanks.html"
      >
        <input type="hidden" name="form-name" value="contact" />
        <p class="hidden">
          <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
        </p>

        <!-- Basic fields (unchanged) -->
        <div>
          <label class="block text-sm mb-1">Name</label>
          <input class="w-full px-4 py-3 rounded-xl text-black" type="text" name="name" required />
        </div>
        <div>
          <label class="block text-sm mb-1">Email</label>
          <input class="w-full px-4 py-3 rounded-xl text-black" type="email" name="email" required />
        </div>
        <div>
          <label class="block text-sm mb-1">Company</label>
          <input class="w-full px-4 py-3 rounded-xl text-black" type="text" name="company" />
        </div>
        <div>
          <label class="block text-sm mb-1">Message</label>
          <textarea class="w-full px-4 py-3 rounded-xl text-black" rows="5" name="message"></textarea>
        </div>

        <!-- Opt-in flags -->
        <div class="mt-6 space-y-2">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="wantsPhone" class="h-4 w-4" />
            <span class="text-sm">Share my phone number for a quick call</span>
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="wantsIds" class="h-4 w-4" />
            <span class="text-sm">Include non-sensitive IDs (e.g., Partner, Vendor, Program)</span>
          </label>
        </div>

        <!-- Phone details (conditionally shown) -->
        <div id="phoneFields" class="mt-4 hidden">
          <div class="grid grid-cols-1 sm:grid-cols-[140px_1fr] gap-3">
            <div>
              <label class="block text-sm mb-1">Country</label>
              <select name="phone_country" class="w-full px-4 py-3 rounded-xl text-black">
                <option value="+1">+1 (US/CA)</option>
                <option value="+52">+52 (MX)</option>
                <option value="+44">+44 (UK)</option>
                <option value="+61">+61 (AU)</option>
                <option value="+82">+82 (KR)</option>
                <option value="+91">+91 (IN)</option>
                <!-- add as needed -->
              </select>
            </div>
            <div>
              <label class="block text-sm mb-1">Phone number</label>
              <input name="phone" type="tel" inputmode="tel" class="w-full px-4 py-3 rounded-xl text-black" placeholder="555-123-4567" />
            </div>
          </div>
          <div class="mt-3">
            <label class="block text-sm mb-1">Best time to call</label>
            <select name="phone_best_time" class="w-full px-4 py-3 rounded-xl text-black">
              <option value="">No preference</option>
              <option value="morning">Morning</option>
              <option value="afternoon">Afternoon</option>
              <option value="evening">Evening</option>
            </select>
          </div>
          <label class="mt-3 inline-flex items-center gap-2">
            <input type="checkbox" name="phone_consent" class="h-4 w-4" />
            <span class="text-sm">I consent to being contacted at this number for this inquiry.</span>
          </label>
        </div>

        <!-- IDs (conditionally shown) -->
        <div id="idFields" class="mt-4 hidden">
          <div>
            <label class="block text-sm mb-1">ID type</label>
            <select name="id_type" class="w-full px-4 py-3 rounded-xl text-black">
              <option value="">Select an ID type</option>
              <option value="partner_id">Partner ID</option>
              <option value="vendor_id">Vendor ID</option>
              <option value="program_id">Program ID</option>
              <option value="customer_ref">Customer Reference</option>
            </select>
          </div>
          <div class="mt-3">
            <label class="block text-sm mb-1">ID value</label>
            <input name="id_value" class="w-full px-4 py-3 rounded-xl text-black" placeholder="e.g., PRGM-00123" />
          </div>
          <p class="mt-2 text-xs text-white/60">
            Please avoid sensitive personal IDs (e.g., SSN, passport). Business identifiers only.
          </p>
        </div>

        <!-- Netlify reCAPTCHA -->
        <div class="mt-6" data-netlify-recaptcha="true"></div>

        <!-- Submit -->
        <button
          class="px-6 py-3 rounded-xl bg-white text-black font-semibold hover:opacity-90"
          type="submit"
        >
          Send
        </button>
      </form>

      <script>
        // Minimal progressive enhancement for conditional fields
        (function () {
          const wantsPhone = document.getElementById('wantsPhone');
          const wantsIds = document.getElementById('wantsIds');
          const phoneFields = document.getElementById('phoneFields');
          const idFields = document.getElementById('idFields');

          function toggle(el, on) {
            if (!el) return;
            if (on) {
              el.classList.remove('hidden');
            } else {
              el.classList.add('hidden');
            }
          }

          wantsPhone && wantsPhone.addEventListener('change', () => {
            toggle(phoneFields, wantsPhone.checked);
          });
          wantsIds && wantsIds.addEventListener('change', () => {
            toggle(idFields, wantsIds.checked);
          });
        })();
      </script>


    </section>

    <div id="site-footer"></div>
    <!-- optional footer injection -->
    <script src="/assets/js/include.js"></script>
  </body>
  </body>
</html>

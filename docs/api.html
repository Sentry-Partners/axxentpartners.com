<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link id="brand-css" rel="stylesheet" href="/assets/css/brand.css?v=5" />
    <script>
      window.PAGE_META = {
        title: "APIs & POS – Axxent Partners",
        description: "Go headless or connect supported POS for scale.",
        image: "/assets/img/og-image.svg",
        version: "5",
      };
    </script>
    <!-- 1) Tiny anti-FOUC base (inline so it applies immediately) -->
    <style>html.tw-wait{visibility:hidden}</style>

    <!-- 2) Tailwind (compiled locally) — render-blocking on purpose to avoid blink -->
    <link id="twcss" rel="stylesheet" href="/assets/css/tailwind.css" />

    <!-- 3) Your custom layers AFTER Tailwind so they can override it -->
    <link rel="stylesheet" href="/assets/css/brand.css" />
    <link rel="stylesheet" href="/assets/css/glow.css" />

    <!-- 4) Fonts/meta helper; defer so scripts don't block paint -->
    <script src="/assets/js/head-meta.js" defer></script>  </head>
  <body class="bg-[var(--brand-bg)] text-[var(--brand-fg)] antialiased">
    <div id="site-header"></div>

    <main>
      <!-- API – Hero (three-legs-to-UV-core) -->
      <section class="relative overflow-hidden py-12 sm:py-16 md:py-20 lg:py-24" data-defer-hero>
        <div class="absolute inset-0 opacity-30 brand-gradient blur-3xl z-0"></div>
        <div class="relative z-10">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold leading-tight mb-4 fade-in opacity-0">APIs & POS</h1>
            <h4 class="mb-0 text-lg md:text-xl font-medium fade-in opacity-0">Placeholder page. Content coming soon on API endpoints and POS integrations.</h4>
          </div>
        </div>
      </section>
      <section class="bg-[var(--brand-bg)] text-center py-12 sm:py-16 md:py-20 lg:py-24">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <img src="/assets/img/under-construction.svg" alt="Page in progress" class="mx-auto max-w-6xl w-full h-auto fade-in opacity-0" />
          <p class="mt-6 text-white/80 fade-in opacity-0">
            This page is being connected to the Universal Value Platform. Please check back soon.
          </p>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script src="/assets/js/include.js"></script>
  </body>
</html>

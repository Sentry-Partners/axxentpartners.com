<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      window.PAGE_META = {
        title: "Thanks – Axxent Partners",
        description: "We are excited to be your loyalty provider of Universal Value.",
        image: "/assets/img/og-image.svg",
        version: "8",
      };
    </script>
    <!-- 1) Tiny anti-FOUC base (inline so it applies immediately) -->
    <style>html.tw-wait{visibility:hidden}</style>

    <!-- 2) Tailwind (compiled locally) — render-blocking on purpose to avoid blink -->
    <link id="twcss" rel="stylesheet" href="/assets/css/tailwind.css" />

    <!-- 3) Your custom layers AFTER Tailwind so they can override it -->
    <link rel="stylesheet" href="/assets/css/brand.css" />
    <link rel="stylesheet" href="/assets/css/glow.css" />

    <!-- 4) Fonts/meta helper; defer so scripts don't block paint -->
    <script src="/assets/js/head-meta.js" defer></script>
  </head>
  <body class="bg-[var(--brand-bg)] text-[var(--brand-fg)] antialiased">
    <div id="site-header"></div>

    <main class="min-h-[60vh] grid place-items-center px-4">
      <div class="uv-card uv-glow text-center max-w-lg w-full">
        <h1 class="text-3xl font-bold text-white">Thanks!</h1>
        <p class="mt-3 text-white/80">We received your message and will follow up shortly.</p>
        <a
          href="/index.html"
          class="mt-6 inline-block px-6 py-3 rounded-xl bg-white text-black font-semibold hover:opacity-90"
        >
          Back home
        </a>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="/assets/js/include.js"></script>
  </body>
</html>

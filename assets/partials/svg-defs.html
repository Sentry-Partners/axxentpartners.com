<!-- Hidden global SVG defs: load once per page via header include -->
<svg
  aria-hidden="true"
  focusable="false"
  width="0"
  height="0"
  style="position: absolute; left: -9999px; top: -9999px"
>
  <defs>
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="wash" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <style>
      .grid {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 1;
      }
      .leg,
      .out {
        stroke: url(#uv);
        stroke-width: 4;
        stroke-linecap: round;
        filter: url(#glow);
        stroke-opacity: 0.6;
        stroke-dasharray: 80 220;
        animation: flow 3s linear infinite;
      }
      .out {
        stroke-opacity: 0.7;
      }
      .leg.slow {
        animation-duration: 4.2s;
      }

      .core {
        fill: url(#uv);
        filter: url(#glow);
      }
      .burst {
        stroke: url(#uv);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-opacity: 0.45;
        fill: none;
        filter: url(#glow);
      }

      @keyframes flow {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -320;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          r: 56;
          opacity: 0.65;
        }
        50% {
          r: 68;
          opacity: 0.35;
        }
      }
      .pulse {
        animation: pulse 3.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .leg,
        .out,
        .pulse {
          animation: none;
        }
      }
    </style>
  </defs>
</svg>
<script>
  (function () {
    // Only remove the fallback if a shared defs block exists in #svg-defs
    var sharedRoot = document.getElementById("svg-defs");
    var hasShared =
      sharedRoot &&
      sharedRoot.querySelector("#uv") &&
      sharedRoot.querySelector("#wash") &&
      sharedRoot.querySelector("#glow");
    var fallback = document.getElementById("uv-defs-fallback");
    if (hasShared && fallback) fallback.remove();
  })();
</script>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uvTitle uvDesc">
  <title id="uvTitle">Universal Value Flow</title>
  <desc id="uvDesc">Consumers route value into a Universal Value layer which clears spend and earn flows to merchants and programs.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>

    <style><![CDATA[
      :root { --uv-accent: #63a6ff; }
      .label { fill:#e8efff; font: 600 18px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .small  { fill:#bcd0ff; font: 500 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .panel { fill:#ffffff12; stroke:#ffffff22; }
      .chip  { fill:#ffffff10; stroke:#ffffff26; }
      .chip text { fill:#e8efff; font:600 15px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

      .hub   { fill:#0b1220; stroke:var(--uv-accent); stroke-width:2; }
      .ring  { fill:none; stroke:var(--uv-accent); stroke-width:1; opacity:.45; }

      .flow { fill:none; stroke: var(--uv-accent); color: var(--uv-accent); stroke-width:3; marker-end:url(#arrow); }
      .dash { stroke-dasharray: 10 12; }

      @keyframes dashRight { from{ stroke-dashoffset: 0 } to{ stroke-dashoffset: -260 } }
      @keyframes dashLeft  { from{ stroke-dashoffset: 0 } to{ stroke-dashoffset:  -260 } }
      .anim-right { animation: dashRight 4.8s linear infinite; }
      .anim-left  { animation: dashLeft  4.8s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-right, .anim-left { animation: none !important; }
        .dash { stroke-dasharray: none !important; }
      }
      marker#arrow path { fill: var(--uv-accent); opacity: .9; }
    ]]></style>

    <!-- Arrow tip sits exactly at the path end -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <text class="label" x="120" y="70">Consumers</text>
  <text class="label" x="600" y="70" text-anchor="middle">Universal Value Layer</text>
  <text class="label" x="1080" y="70" text-anchor="end">Merchants &amp; Programs</text>

  <!-- LEFT: Sources -->
  <g transform="translate(60,110)">
    <rect class="panel" x="0" y="0" rx="14" ry="14" width="320" height="380"/>
    <g transform="translate(20,20)">
      <g class="chip"><rect x="0" y="0" rx="12" ry="12" width="120" height="46"/><text x="18" y="30">Points</text></g>
      <g class="chip" transform="translate(140,0)"><rect x="0" y="0" rx="12" ry="12" width="150" height="46"/><text x="18" y="30">Miles</text></g>
      <g class="chip" transform="translate(0,60)"><rect x="0" y="0" rx="12" ry="12" width="180" height="46"/><text x="18" y="30">Gift Cards</text></g>
      <g class="chip" transform="translate(190,60)"><rect x="0" y="0" rx="12" ry="12" width="100" height="46"/><text x="18" y="30">$</text></g>
      <g class="chip" transform="translate(0,120)"><rect x="0" y="0" rx="12" ry="12" width="210" height="46"/><text x="18" y="30">Store Credit</text></g>
      <g class="chip" transform="translate(0,180)"><rect x="0" y="0" rx="12" ry="12" width="150" height="46"/><text x="18" y="30">NFTs</text></g>
      <g class="chip" transform="translate(170,180)"><rect x="0" y="0" rx="12" ry="12" width="120" height="46"/><text x="18" y="30">Crypto</text></g>
      <g class="chip" transform="translate(0,240)"><rect x="0" y="0" rx="12" ry="12" width="220" height="46"/><text x="18" y="30">Alt Rewards</text></g>
    </g>
    <text class="small" x="20" y="365">Spend anywhere · Earn everywhere</text>
  </g>

  <!-- CENTER: UV (cx=600, cy=300, r=90) -->
  <g transform="translate(430,140)">
    <circle class="ring" cx="170" cy="160" r="130"/>
    <circle class="hub"  cx="170" cy="160" r="90"/>
    <text class="label" x="170" y="160" text-anchor="middle" dominant-baseline="middle" style="font-size:20px">Universal Value</text>
    <text class="small" x="170" y="188" text-anchor="middle">Quotes · Split‑Pay · Settle</text>
  </g>

  <!-- RIGHT: Destinations -->
  <g transform="translate(820,110)">
    <rect class="panel" x="0" y="0" rx="14" ry="14" width="320" height="380"/>
    <g transform="translate(20,20)">
      <g class="chip"><rect x="0" y="0" rx="12" ry="12" width="220" height="46"/><text x="18" y="30">Enterprise</text></g>
      <g class="chip" transform="translate(0,60)"><rect x="0" y="0" rx="12" ry="12" width="180" height="46"/><text x="18" y="30">SME / SMB</text></g>
      <g class="chip" transform="translate(0,120)"><rect x="0" y="0" rx="12" ry="12" width="250" height="46"/><text x="18" y="30">Shopify / Woo / BigC</text></g>
      <g class="chip" transform="translate(0,180)"><rect x="0" y="0" rx="12" ry="12" width="200" height="46"/><text x="18" y="30">Marketplaces</text></g>
      <g class="chip" transform="translate(0,240)"><rect x="0" y="0" rx="12" ry="12" width="220" height="46"/><text x="18" y="30">Influencers / Web3</text></g>
    </g>
    <text class="small" x="20" y="365">Issue points · Accept value · Grow</text>
  </g>

  <!-- INBOUND from LEFT (→ into UV), end exactly on circle & approach along the radius -->
  <path class="flow dash anim-right"
        d="M380,190 C480,190 518.29,198.89 543.43,230" />
  <path class="flow dash anim-right"
        d="M380,260 C480,260 483.55,242.22 519.38,260" />
  <path class="flow dash anim-right"
        d="M380,330 C480,330 477.43,343.33 515.15,330" />

  <!-- INBOUND from RIGHT (← into UV), end exactly on circle & approach along the radius -->
<path class="flow dash anim-left" d="M820,220 C720,220 659.56,184.44 641.23,220" />
<path class="flow dash anim-left" d="M820,290 C720,290 729.20,285.56 689.44,290" />
<path class="flow dash anim-left" d="M820,360 C720,360 696.90,386.67 667.08,360" />

</svg>
